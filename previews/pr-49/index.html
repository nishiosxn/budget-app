<!doctype html>
<html lang="fr" data-demo-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Répartition des budgets · Démo interactive Smart Budget</title>
<style>
:root{color-scheme:light;--bg:#f4f5f1;--panel:#fff;--panel-2:#f7f8f7;--text:#24332a;--muted:#66746c;--line:#e2e7e1;--radius:1.25rem;--shadow:0 .65rem 1.75rem rgba(15,30,20,.055);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
[data-demo-theme="dark"]{color-scheme:dark;--bg:#0e1014;--panel:#191c22;--panel-2:#242831;--text:#f5f6f9;--muted:#a7afb9;--line:#353b45;--shadow:0 .8rem 1.75rem rgba(0,0,0,.15)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);min-height:100dvh}
.shell{width:min(66rem,calc(100% - 2rem));margin:0 auto;padding:clamp(1.25rem,3vw,2.25rem) 0 4rem}
.header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.brand{display:flex;gap:.75rem;align-items:center}
.brand-symbol{display:grid;place-items:center;width:2.75rem;height:2.75rem;background:#5c29d6;color:white;border-radius:.9rem;font-weight:800;font-size:1.1rem}
.brand h1{font-size:1.05rem;line-height:1.2;margin:0}
.brand p{font-size:.75rem;color:var(--muted);margin:.25rem 0 0}
.controls{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}
.controls>label{display:flex;align-items:center;gap:.45rem;color:var(--muted);font-size:.75rem}
.controls select,.controls button{min-height:2.5rem;padding:.5rem .7rem;border-radius:.75rem;background:var(--panel);border:.0625rem solid var(--line);color:var(--text);font:inherit;font-size:.8125rem;cursor:pointer}
.context{display:flex;align-items:start;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1rem 1.15rem;border:1px dashed var(--line);border-radius:1rem;margin:0 0 1.25rem;background:var(--panel-2)}
.context strong{display:block;font-size:.875rem}
.context span{display:block;margin-top:.3rem;color:var(--muted);font-size:.75rem;line-height:1.5}
.context em{font-size:.75rem;font-style:normal;color:#ab91ff}
.demo-note{font-size:.8125rem;color:var(--muted);margin:-.5rem 0 1rem;text-align:right}
.income-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1.25rem}
@media(max-width:40rem){.income-list{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius)}
.category-group{margin-top:1rem}
.category-group-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.25rem .15rem .65rem}
.category-group-head h2{font-size:1rem;margin:0}
.category-group-head span{font-size:.7rem;color:var(--muted)}
.category-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(17rem,100%),1fr));gap:.85rem}
.cat-section{padding:1rem;min-width:0}
.cat-section-title{font-size:.875rem;font-weight:750}
.cat-section-total{margin:.25rem 0 .75rem;font-size:.75rem;color:var(--muted);font-weight:450}
.cat-item{display:grid;gap:.25rem;padding:.7rem 0;border-top:1px solid var(--line)}
.cat-item .cat-main{display:flex;justify-content:space-between;gap:.6rem;font-size:.8125rem;align-items:baseline}
.cat-item .cat-main strong{font-variant-numeric:tabular-nums}
.cat-item small{font-size:.72rem;color:var(--muted)}
.cat-item button{min-height:2.35rem;background:transparent;color:#bba6ff;border:1px solid var(--line);border-radius:.6rem;padding:.35rem .6rem;font:inherit;font-size:.75rem;cursor:pointer}
.cat-item>div:last-child{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.cat-item:focus{outline:2px solid #8869ef;outline-offset:2px;border-radius:.35rem}
.category-filter-banner{display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-radius:.85rem;border:1px solid var(--line);background:var(--panel);font-size:.8125rem}
.category-filter-banner button{border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;padding:.5rem .7rem;border-radius:.6rem;cursor:pointer}
[hidden]{display:none!important}
dialog{width:min(25rem,calc(100% - 2rem));padding:1.2rem;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:1.1rem;box-shadow:0 1.75rem 5rem rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.58)}
dialog form{display:grid;gap:1rem}
dialog h2{margin:0;font-size:1.1rem}
dialog label{display:grid;gap:.35rem;font-size:.8125rem;color:var(--muted)}
dialog input{padding:.65rem .75rem;border:1px solid var(--line);border-radius:.7rem;color:var(--text);background:var(--panel-2);font:inherit;font-size:1rem}
dialog p{font-size:.75rem;color:var(--muted);margin:0}
dialog .buttons{display:flex;gap:.65rem;justify-content:flex-end}
dialog button{padding:.65rem .85rem;border-radius:.7rem;border:1px solid var(--line);font:inherit;cursor:pointer;background:var(--panel-2);color:var(--text)}
dialog button.primary{border-color:#5c29d6;background:#5c29d6;color:white;font-weight:700}
@media(max-width:32rem){.controls{width:100%}.controls>label{flex:1}.controls select{width:100%}}
</style>
<link rel="stylesheet" href="./category-distribution.css">
<script defer src="./category-distribution.js"></script>
</head>
<body>
<div class="shell">
 <header class="header"><div class="brand"><div class="brand-symbol">✓</div><div><h1>Smart Budget</h1></div></div>
 <div class="controls"><label>Mois <select id="demoMonth"><option value="Octobre 2026">Octobre 2026</option><option value="Novembre 2026" selected>Novembre 2026</option><option value="Décembre 2026">Décembre 2026</option></select></label>
 <button id="themeToggle" type="button">Mode clair</button></div></header>
 <p class="demo-note">Données fictives · Aucun compte connecté</p>
 <main id="categories"><section id="categoryDistribution" class="card budget-distribution" aria-label="Répartition des budgets prévus"></section><div id="categoryGrid" class="category-layout"></div></main>
</div>
<dialog id="budgetDialog"><form id="budgetForm" method="dialog"><h2>Modifier le budget</h2><p>Simulation locale · Sans enregistrement</p><label>Catégorie<input id="demoCategoryName" type="text" readonly></label><label>Nouveau budget mensuel (€)<input id="demoBudgetAmount" type="number" min="0" max="1000000" step=".01" inputmode="decimal" required></label><div class="buttons"><button value="cancel" type="button" id="closeBudget">Annuler</button><button value="save" class="primary" type="submit">Appliquer</button></div></form></dialog>
<script>
const state={selectedMonth:"Novembre 2026",createdMonth:"2026-09"};
const MONTHS={"Octobre 2026":"2026-10","Novembre 2026":"2026-11","Décembre 2026":"2026-12"};
function monthKey(label){return MONTHS[label]||label}
function previousMonthKey(key){const [y,m]=key.split("-").map(Number),d=new Date(Date.UTC(y,m-2,1));return d.toISOString().slice(0,7)}
const source=[
 {id:"rent",name:"Loyer",section:"Obligatoires",owner:"common",budget:530},
 {id:"insurance",name:"Assurance",section:"Obligatoires",owner:"B",budget:75},
 {id:"groceries",name:"Courses",section:"Vie courante",owner:"common",budget:250},
 {id:"car",name:"Carburant",section:"Vie courante",owner:"B",budget:120},
 {id:"health",name:"Santé",section:"Vie courante",owner:"B",budget:0},
 {id:"internet",name:"Internet",section:"Abonnements",owner:"common",budget:40},
 {id:"music",name:"Musique",section:"Abonnements",owner:"B",budget:12}
];
const finance={
 "2026-10":{expense:{rent:530,insurance:75,groceries:210,car:120,health:0,internet:40,music:12},income:{salary:1700,benefits:200},saving:{reserve:100,projects:30}},
 "2026-11":{expense:{rent:530,insurance:75,groceries:250,car:120,health:0,internet:40,music:12},income:{salary:1700,benefits:200},saving:{reserve:100,projects:40}},
 "2026-12":{expense:{rent:530,insurance:75,groceries:280,car:90,health:0,internet:40,music:12},income:{salary:1750,benefits:200},saving:{reserve:120,projects:40}}
};
const revenue=[{id:"salary",name:"Salaire",owner:"B"},{id:"benefits",name:"Aides",owner:"B"}];
const savings=[{id:"reserve",name:"Épargne de précaution",owner:"B"},{id:"projects",name:"Projets",owner:"B"}];
const actuals={
 "2026-10":{expense:{rent:530,insurance:75,groceries:198,car:105,health:0,internet:40,music:12},income:{salary:1700,benefits:200},saving:{reserve:80,projects:25}},
 "2026-11":{expense:{rent:530,insurance:75,groceries:186,car:54,health:0,internet:40,music:12},income:{salary:1700,benefits:200},saving:{reserve:60,projects:20}},
 "2026-12":{expense:{},income:{},saving:{}}
};
function visibleExpenseCategories(label=state.selectedMonth){const key=monthKey(label);return source.map(c=>({...c,budget:finance[key]?.expense?.[c.id]??c.budget}))}
function visibleIncomeCategories(label=state.selectedMonth){const key=monthKey(label);return revenue.map(c=>({...c,budget:finance[key]?.income?.[c.id]??0}))}
function visibleSavingCategories(label=state.selectedMonth){const key=monthKey(label);return savings.map(c=>({...c,budget:finance[key]?.saving?.[c.id]??0}))}
function actual(type,id){return actuals[monthKey(state.selectedMonth)]?.[type]?.[id]??0}
const currency=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(n);
const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function metrics(){return {}}
function renderCategories(){
 const filter=globalThis.SmartBudgetCategoryDistribution?.filter()||null,ids=filter?new Set(filter.ids):null;
 const include=(type,cats)=>filter?(filter.type===type?cats.filter(c=>ids.has(c.id)):[]):cats;
 const income=include("income",visibleIncomeCategories());
 const expense=include("expense",visibleExpenseCategories());
 const saving=!filter?visibleSavingCategories():[];
 const parts=[];
 const figures=(reel,prevu)=>'<div class="cg-figures"><span><strong>'+currency(reel)+'</strong> réel</span><span><strong>'+currency(prevu)+'</strong> prévu</span></div>';
 const row=(type,c)=>'<div class="cat-item" data-category-row="'+safe(c.id)+'"><div class="cat-main"><span>'+safe(c.name)+'</span><strong>'+currency(actual(type,c.id))+'</strong></div>'+
  '<div><small>Prévu '+currency(c.budget)+' · '+(c.owner==="common"?"À deux":"Personne 1")+'</small><button type="button" data-demo-edit="'+safe(type+":"+c.id)+'">Modifier</button></div></div>';
 const panel=(key,title,metrics,inner)=>'<section class="category-group card" aria-labelledby="'+key+'"><div class="category-group-head"><h2 id="'+key+'">'+title+'</h2>'+metrics+'</div><div class="category-cards'+(title==="Dépenses"?"":" income-cards")+'">'+inner+'</div></section>';
 if(income.length){
  parts.push(panel("demo-revenus","Revenus",figures(income.reduce((n,c)=>n+actual("income",c.id),0),income.reduce((n,c)=>n+c.budget,0)),
   '<article class="cat-section cat-section-single income-card"><div class="income-list">'+income.map(c=>row("income",c)).join("")+'</div></article>'));
 }
 const groups=["Obligatoires","Abonnements","Vie courante"].map(name=>({name,cats:expense.filter(c=>c.section===name)})).filter(g=>g.cats.length);
 if(groups.length){
  parts.push(panel("demo-depenses","Dépenses",
   figures(expense.reduce((n,c)=>n+actual("expense",c.id),0),expense.reduce((n,c)=>n+c.budget,0)),
   groups.map(g=>'<article class="cat-section"><div class="cat-section-head"><div class="cat-section-title">'+safe(g.name)+
    '<div class="cat-section-total">'+currency(g.cats.reduce((n,c)=>n+actual("expense",c.id),0))+' réel · '+currency(g.cats.reduce((n,c)=>n+c.budget,0))+' prévu</div></div></div>'+
    g.cats.map(c=>row("expense",c)).join("")+'</article>').join("")));
 }
 if(saving.length){
  parts.push(panel("demo-epargne","Épargne",figures(saving.reduce((n,c)=>n+actual("saving",c.id),0),saving.reduce((n,c)=>n+c.budget,0)),
   '<article class="cat-section cat-section-single saving-card"><div class="income-list">'+saving.map(c=>row("saving",c)).join("")+'</div></article>'));
 }
 document.getElementById("categoryGrid").innerHTML=(filter?'<div class="category-filter-banner" role="status"><strong>'+safe(filter.label)+'</strong><button type="button" data-clear-category-filter>Tout afficher</button></div>':"")+parts.join("");
}
let edited=null;
function openCategoryEditor(id,_section,_mode,type){
 const c=(type==="income"?visibleIncomeCategories():type==="saving"?visibleSavingCategories():visibleExpenseCategories()).find(v=>v.id===id);
 if(!c)return;
 edited={id,type};document.getElementById("demoCategoryName").value=c.name;
 document.getElementById("demoBudgetAmount").value=c.budget;
 document.getElementById("budgetDialog").showModal();
}
document.getElementById("demoMonth").addEventListener("change",e=>{
 state.selectedMonth=e.target.value;globalThis.SmartBudgetCategoryDistribution?.render();renderCategories()
});
document.getElementById("themeToggle").addEventListener("click",e=>{
 const root=document.documentElement,dark=root.dataset.demoTheme!=="dark";
 root.dataset.demoTheme=dark?"dark":"light";e.target.textContent=dark?"Mode clair":"Mode sombre";
});
document.getElementById("categoryGrid").addEventListener("click",e=>{
 const clear=e.target.closest("[data-clear-category-filter]");
 if(clear){globalThis.SmartBudgetCategoryDistribution?.clear();return}
 const edit=e.target.closest("[data-demo-edit]");
 if(edit){const [type,id]=edit.dataset.demoEdit.split(":");openCategoryEditor(id,null,"planned",type)}
});
document.getElementById("closeBudget").addEventListener("click",()=>document.getElementById("budgetDialog").close());
document.getElementById("budgetForm").addEventListener("submit",e=>{
 e.preventDefault();if(!edited)return;
 const amount=Number(document.getElementById("demoBudgetAmount").value);
 if(!Number.isFinite(amount)||amount<0||amount>1e6)return;
 const key=monthKey(state.selectedMonth);
 finance[key][edited.type][edited.id]=Math.round(amount*100)/100;
 document.getElementById("budgetDialog").close();
 globalThis.SmartBudgetCategoryDistribution?.render();renderCategories();
});
window.addEventListener("DOMContentLoaded",()=>{globalThis.SmartBudgetCategoryDistribution?.render();renderCategories()});
</script>
</body>
</html>
