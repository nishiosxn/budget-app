name: V3.1 connected test

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected:
    name: Supabase local · comptes fictifs
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.90.0"
      - name: Start a disposable Supabase instance
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/smart-budget-stack"
          cd "$RUNNER_TEMP/smart-budget-stack"
          supabase init
          supabase start -x studio,imgproxy,storage-api,inbucket,logflare,vector,supavisor,postgres-meta,edge-runtime
          supabase status -o json > "$RUNNER_TEMP/smart-budget-stack/status.json"
      - name: Load the synthetic V3.0.2 contract and versioned migrations
        shell: bash
        run: |
          set -euo pipefail
          db_url="$(jq -er .DB_URL "$RUNNER_TEMP/smart-budget-stack/status.json")"
          case "$db_url" in
            postgresql://*@127.0.0.1:54322/postgres) ;;
            *) echo 'Expected local disposable database'; exit 1 ;;
          esac
          psql "$db_url" -X -f scripts/connected-test/schema.sql
      - name: Install Chromium for independent sessions
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/smart-budget-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/smart-budget-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run connected acceptance checks
        shell: bash
        run: |
          SB_STACK_STATUS="$RUNNER_TEMP/smart-budget-stack/status.json" \
          SB_TEST_PLAYWRIGHT="$RUNNER_TEMP/smart-budget-browser/node_modules/playwright/index.mjs" \
          node --test --test-concurrency=1 scripts/connected-test/auth.mjs scripts/connected-test/builder-categories.mjs
      - name: Stop the disposable stack
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/smart-budget-stack/supabase" ]; then
            cd "$RUNNER_TEMP/smart-budget-stack"
            supabase stop
          fi
