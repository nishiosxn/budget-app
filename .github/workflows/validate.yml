name: Validate application

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: App integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run application audit
        run: |
          node --test scripts/validate-docs.test.mjs scripts/cloud-sync-roundtrip.test.mjs scripts/subscriptions-overview.test.mjs scripts/backup-sql.test.mjs scripts/offsite-backup.test.mjs scripts/motion-v3.test.mjs scripts/assistant-core.test.mjs scripts/assistant-gateway.test.mjs scripts/assistant-planner.test.mjs scripts/assistant-benchmark.test.mjs scripts/assistant-brand.test.mjs scripts/assistant-demo.test.mjs scripts/assistant-voice.test.mjs scripts/assistant-live.test.mjs scripts/assistant-engine.test.mjs scripts/assistant-category-rules.test.mjs scripts/assistant-field-regressions.test.mjs scripts/assistant-expense-labels.test.mjs scripts/assistant-owners-medical.test.mjs
          node --test scripts/admin-cors.test.mjs
          node scripts/validate.mjs
